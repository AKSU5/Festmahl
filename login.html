
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festmahl – Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #edf4ff;
      background: radial-gradient(circle at top, #183a70, #07111f 65%);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: #101e32;
      border: 1px solid #29466c;
      border-radius: 20px;
      box-shadow: 0 20px 60px #0006;
    }

    .logo { text-align: center; font-size: 48px; }

    h1 { text-align: center; margin-bottom: 8px; }

    .subtitle {
      text-align: center;
      color: #a8bad3;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #385477;
      border-radius: 10px;
      background: #091526;
      color: white;
      font-size: 16px;
    }

    input:focus { outline: 2px solid #3287ee; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 0;
      border-radius: 10px;
      background: #3287ee;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #57a0ff; }
    button:disabled { opacity: .6; cursor: wait; }

    #meldung {
      min-height: 22px;
      color: #ff9292;
      text-align: center;
      font-size: 14px;
    }

    .hint {
      color: #8fa6c4;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">🍽️</div>
    <h1>Festmahl</h1>
    <p class="subtitle">Schön, dass du dabei bist!</p>

    <form id="loginForm">
      <label for="username">Benutzername</label>
      <input
        id="username"
        type="text"
        placeholder="Zum Beispiel Enes"
        autocomplete="username"
        required
      >

      <label for="password">Passwort</label>
      <input
        id="password"
        type="password"
        placeholder="Dein Passwort"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Anmelden</button>
      <p id="meldung" role="status" aria-live="polite"></p>
    </form>

    <p class="hint">
      Melde dich mit deinem Namen und deinem persönlichen Passwort an.
    </p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithCustomToken,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaWginvhLgRfBwRCQ65eBEt88fkQ3OVDA",
    authDomain: "festmahl-10cc0.firebaseapp.com",
    projectId: "festmahl-10cc0",
      appId: "1:259790349825:web:098044da80ab3324800200",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Später durch die tatsächliche URL deiner Cloud Function ersetzen.
    const LOGIN_FUNCTION_URL = "DEINE_CLOUD_FUNCTION_URL";

    const erlaubteNamen = [
      "enes",
      "robert",
      "oliver",
      "tim",
      "felix",
      "david",
      "simon",
      "axel",
      "sebastian"
    ];

    const form = document.getElementById("loginForm");
    const meldung = document.getElementById("meldung");
    const button = document.getElementById("loginButton");

    onAuthStateChanged(auth, user => {
      if (user) {
        window.location.replace("index.html");
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const username = document
        .getElementById("username")
        .value.trim()
        .toLowerCase();

      const password = document
        .getElementById("password")
        .value;

      meldung.textContent = "";

      if (!erlaubteNamen.includes(username)) {
        meldung.textContent = "Benutzername oder Passwort falsch.";
        return;
      }

      if (!LOGIN_FUNCTION_URL.startsWith("https://")) {
        meldung.textContent =
          "Die sichere Anmeldefunktion ist noch nicht eingerichtet.";
        return;
      }

      button.disabled = true;
      button.textContent = "Anmeldung läuft ...";

      try {
        const response = await fetch(LOGIN_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          throw new Error("Anmeldung fehlgeschlagen.");
        }

        const data = await response.json();

        if (!data.customToken) {
          throw new Error("Kein Anmeldetoken erhalten.");
        }

        await signInWithCustomToken(auth, data.customToken);
        window.location.replace("index.html");
      } catch (error) {
        console.error(error);
        meldung.textContent =
          "Anmeldung fehlgeschlagen. Prüfe deine Zugangsdaten.";
      } finally {
        button.disabled = false;
        button.textContent = "Anmelden";
      }
    });
  </script>
</body>
</html>
