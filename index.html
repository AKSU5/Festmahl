<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festmahl – Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #edf4ff;
      background: #07111f;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 20px 5%;
      background: #101e32;
      border-bottom: 1px solid #29466c;
    }

    .brand { font-size: 25px; font-weight: bold; }
    .brand span { color: #58a5ff; }

    button {
      padding: 10px 16px;
      border: 1px solid #45617f;
      border-radius: 9px;
      background: #203752;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #345577; }

    main {
      width: 90%;
      max-width: 1200px;
      margin: 35px auto;
    }

    .welcome { margin-bottom: 30px; }
    .welcome h1 { font-size: clamp(26px, 4vw, 38px); }
    .muted { color: #a8bad3; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .card {
      min-width: 0;
      padding: 23px;
      background: #101e32;
      border: 1px solid #29466c;
      border-radius: 15px;
    }

    .stat-label { color: #a8bad3; font-size: 14px; }
    .stat-number {
      margin-top: 12px;
      color: #69b0ff;
      font-size: 30px;
      font-weight: bold;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    h2 { margin-top: 0; font-size: 21px; }

    .event, .ranking-row {
      padding: 14px 0;
      border-bottom: 1px solid #263b55;
    }

    .event:last-child, .ranking-row:last-child { border-bottom: none; }

    .event { display: flex; justify-content: space-between; gap: 10px; }
    .event-date { color: #69b0ff; font-size: 13px; }
    .event-name { margin-top: 6px; font-weight: bold; }
    .event-description { margin-top: 5px; color: #a8bad3; font-size: 14px; }

    .ranking-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ranking-row.me { background: #16294a; border-radius: 8px; padding-left: 8px; padding-right: 8px; }

    .rank { width: 28px; color: #69b0ff; font-weight: bold; }
    .person { flex: 1; overflow-wrap: anywhere; }
    .bottle-count { white-space: nowrap; font-weight: bold; }

    .small-btn { padding: 4px 10px; font-size: 16px; }
    .delete-btn { padding: 4px 10px; height: fit-content; background: #4a2230; border-color: #7a3a4d; }
    .delete-btn:hover { background: #6b2e43; }

    .admin-form {
      display: grid;
      gap: 10px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #263b55;
    }

    .admin-form h3 { margin: 0; font-size: 16px; }

    .admin-form input {
      width: 100%;
      padding: 10px;
      border: 1px solid #385477;
      border-radius: 8px;
      background: #091526;
      color: white;
      font-size: 15px;
    }

    .admin-form button { background: #3287ee; border: 0; font-weight: bold; }
    .admin-form button:hover { background: #57a0ff; }

.add-form {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid #263b55;
}

.add-form input {
  flex: 1;
  min-width: 0;
  padding: 10px;
  border: 1px solid #385477;
  border-radius: 8px;
  background: #091526;
  color: white;
  font-size: 15px;
}

.add-form button { background: #3287ee; border: 0; font-weight: bold; }
.add-form button:hover { background: #57a0ff; }

    footer {
      padding: 25px;
      color: #8299b8;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 750px) {
      .stats, .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">🍽️ <span>Festmahl</span></div>
    <button id="logoutButton">Abmelden</button>
  </header>

  <main>
    <section class="welcome">
      <h1 id="welcomeTitle">Hallo!</h1>
      <p class="muted">Willkommen zurück bei Festmahl.</p>
    </section>

    <section class="stats">
      <div class="card">
        <div class="stat-label">Geplante Festmahle</div>
        <div class="stat-number" id="eventCount">0</div>
      </div>

      <div class="card">
        <div class="stat-label">Gesammelte Pfandflaschen</div>
        <div class="stat-number" id="bottleTotal">0</div>
      </div>

      <div class="card">
        <div class="stat-label">Mitglieder</div>
        <div class="stat-number">9</div>
      </div>
    </section>

    <section class="content-grid">
      <div class="card">
        <h2>📅 Festmahl-Kalender</h2>
        <div id="calendar" class="muted">Termine werden geladen ...</div>

        <form id="eventForm" class="admin-form" hidden>
          <h3>Neuen Termin eintragen</h3>
          <input id="eventDate" type="date" required>
          <input id="eventName" type="text" placeholder="Name des Termins" maxlength="80" required>
          <input id="eventDesc" type="text" placeholder="Beschreibung (optional)" maxlength="200">
          <button type="submit">Termin hinzufügen</button>
        </form>
      </div>

      <div class="card">
        <h2>🏆 Pfandflaschen-Rangliste</h2>
        <div id="ranking" class="muted">Rangliste wird geladen ...</div>

<form id="addForm" class="add-form">
  <input id="addAmount" type="number" step="1" min="-1000" max="1000"
         placeholder="Anzahl Flaschen" required>
  <button type="submit">🍾 Hinzufügen</button>
</form>
      </div>
    </section>
  </main>

  <footer>Festmahl · Gemeinsam planen, sammeln und genießen.</footer>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      onSnapshot,
      addDoc,
      deleteDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaWginvhLgRfBwRCQ65eBEt88fkQ3OVDA",
      authDomain: "festmahl-10cc0.firebaseapp.com",
      projectId: "festmahl-10cc0",
      appId: "1:259790349825:web:098044da80ab3324800200"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const mitglieder = {
      enes: "Enes",
      robert: "Robert",
      oliver: "Oliver",
      tim: "Tim",
      felix: "Felix",
      david: "David",
      simon: "Simon",
      axel: "Axel",
      sebastian: "Sebastian"
    };

    // Nur diese beiden sehen die Bearbeiten-Funktionen für den Kalender.
    // Die echte Absicherung passiert in den Firestore-Regeln.
    const kalenderAdmins = ["enes", "sebastian"];

    const kalender = document.getElementById("calendar");
    const rangliste = document.getElementById("ranking");
    const eventForm = document.getElementById("eventForm");

    let aktuellerUser = null;
    let istAdmin = false;
    let termine = [];
    let pfand = {};
    let listenerGestartet = false;

    function zeigeTermine() {
      kalender.replaceChildren();

      const sortiert = [...termine].sort(
        (a, b) => a.datum.localeCompare(b.datum)
      );

      document.getElementById("eventCount").textContent = sortiert.length;

      if (sortiert.length === 0) {
        kalender.textContent = "Noch keine Termine eingetragen.";
        return;
      }

      for (const termin of sortiert) {
        const event = document.createElement("div");
        event.className = "event";

        const text = document.createElement("div");

        const datum = document.createElement("div");
        datum.className = "event-date";
        datum.textContent = new Date(
          termin.datum + "T12:00:00"
        ).toLocaleDateString("de-AT", {
          day: "2-digit",
          month: "long",
          year: "numeric"
        });

        const name = document.createElement("div");
        name.className = "event-name";
        name.textContent = termin.name;

        const beschreibung = document.createElement("div");
        beschreibung.className = "event-description";
        beschreibung.textContent = termin.beschreibung || "";

        text.append(datum, name, beschreibung);
        event.appendChild(text);

        if (istAdmin) {
          const loeschen = document.createElement("button");
          loeschen.className = "delete-btn";
          loeschen.textContent = "🗑";
          loeschen.title = "Termin löschen";
          loeschen.addEventListener("click", async () => {
            if (!confirm(`„${termin.name}“ wirklich löschen?`)) return;
            try {
              await deleteDoc(doc(db, "termine", termin.id));
            } catch (error) {
              console.error(error);
              alert("Löschen nicht möglich.");
            }
          });
          event.appendChild(loeschen);
        }

        kalender.appendChild(event);
      }
    }

  async function fuegeFlaschenHinzu(menge) {
  const neu = Math.max(0, (pfand[aktuellerUser] ?? 0) + menge);
  try {
    await setDoc(doc(db, "pfandflaschen", aktuellerUser), { anzahl: neu });
  } catch (error) {
    console.error(error);
    alert("Speichern nicht möglich.");
  }
}

    function zeigeRangliste() {
      rangliste.replaceChildren();

      const sortiert = Object.keys(mitglieder)
        .map(id => ({
          id,
          name: mitglieder[id],
          anzahl: pfand[id] ?? 0
        }))
        .sort((a, b) => b.anzahl - a.anzahl);

      const gesamt = sortiert.reduce((summe, p) => summe + p.anzahl, 0);
      document.getElementById("bottleTotal").textContent = gesamt;

      sortiert.forEach((person, index) => {
        const zeile = document.createElement("div");
        zeile.className = "ranking-row";
        if (person.id === aktuellerUser) zeile.classList.add("me");

        const platz = document.createElement("div");
        platz.className = "rank";
        platz.textContent = `${index + 1}.`;

        const name = document.createElement("div");
        name.className = "person";
        name.textContent = person.name;

        const anzahl = document.createElement("div");
        anzahl.className = "bottle-count";
        anzahl.textContent = `🍾 ${person.anzahl}`;

        zeile.append(platz, name);

        // Nur in der eigenen Zeile gibt es + und −
        if (person.id === aktuellerUser) {
          const minus = document.createElement("button");
          minus.className = "small-btn";
          minus.textContent = "−";
          minus.addEventListener("click", () => aendereMeineFlaschen(-1));

          const plus = document.createElement("button");
          plus.className = "small-btn";
          plus.textContent = "+";
          plus.addEventListener("click", () => aendereMeineFlaschen(1));

          zeile.append(minus, anzahl, plus);
        } else {
          zeile.append(anzahl);
        }

        rangliste.appendChild(zeile);
      });
    }

    function starteListener() {
      if (listenerGestartet) return;
      listenerGestartet = true;

      onSnapshot(
        collection(db, "termine"),
        snapshot => {
          termine = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          zeigeTermine();
        },
        error => {
          console.error(error);
          kalender.textContent = "Termine konnten nicht geladen werden.";
        }
      );

      onSnapshot(
        collection(db, "pfandflaschen"),
        snapshot => {
          pfand = {};
          snapshot.forEach(d => { pfand[d.id] = d.data().anzahl ?? 0; });
          zeigeRangliste();
        },
        error => {
          console.error(error);
          rangliste.textContent = "Rangliste konnte nicht geladen werden.";
        }
      );
    }

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }

      const username = (user.email || "").split("@")[0].toLowerCase();
      const name = mitglieder[username];

      if (!name) {
        signOut(auth);
        window.location.replace("login.html");
        return;
      }

      aktuellerUser = username;
      istAdmin = kalenderAdmins.includes(username);
      eventForm.hidden = !istAdmin;

      document.getElementById("welcomeTitle").textContent = `Hallo ${name}!`;

      starteListener();
    });

    eventForm.addEventListener("submit", async event => {
      event.preventDefault();

      const datum = document.getElementById("eventDate").value;
      const name = document.getElementById("eventName").value.trim();
      const beschreibung = document.getElementById("eventDesc").value.trim();

      try {
        await addDoc(collection(db, "termine"), { datum, name, beschreibung });
        eventForm.reset();
      } catch (error) {
        console.error(error);
        alert("Termin konnte nicht gespeichert werden.");
      }
    });

    document.getElementById("addForm").addEventListener("submit", async event => {
  event.preventDefault();

  const eingabe = document.getElementById("addAmount");
  const menge = parseInt(eingabe.value, 10);

  if (!Number.isInteger(menge) || menge === 0) return;

  await fuegeFlaschenHinzu(menge);
  eingabe.value = "";
});

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await signOut(auth);
      window.location.replace("login.html");
    });
  </script>
</body>
</html>
